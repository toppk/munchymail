[package]
name = "munchymail"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
libc = "0.2.190"
mailparse = "0.18.0"
pollster = "1.0.1"
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4.46"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
turso = "0.8.2"
