[package]
name = "munchymail"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
data-encoding = "2.11.1"
flate2 = "1.1.10"
imap-codec = "=2.0.0-alpha.10"
infer = "0.22.0"
io-imap = "0.10.0"
io-sasl = "0.2.0"
libc = "0.2.190"
mailparse = "0.18.0"
pollster = "1.0.1"
rayon = "1.12.0"
pimalaya-stream = { version = "0.4.0", features = ["rustls-ring"] }
regex = "1.13.1"
secrecy = "0.10.3"
serde_json = "1.0.154"
sha2 = "0.11.0"
tantivy = "0.26.2"
tar = "0.4.46"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
turso = "0.8.2"
url = "2.5.7"
ureq = "3.5.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
